<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Vercel serves dist/404.html (with a real 404 status) for any path
         that has no file behind it. __SITE_*__ tokens are filled by the
         seo() plugin in vite.config.ts, same as index.html. -->
    <title>Lost in space · __SITE_NAME__</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="__SITE_THEME_COLOR__" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/svg+xml" href="/rocket.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Kalam:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <noscript>
      <div style="padding: 4rem 1.25rem; text-align: center">
        <h1>This page drifted off the map.</h1>
        <p>There's nothing here. <a href="/" style="color: #ffd43b">Head back to __SITE_NAME__</a>.</p>
      </div>
    </noscript>

    <script type="module" src="/src/main-404.tsx"></script>
  </body>
</html>
