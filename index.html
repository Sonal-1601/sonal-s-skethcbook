<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Core ─────────────────────────────────────────────
         Every __SITE_*__ token is filled at build time from
         src/data/site.ts by the seo() plugin in vite.config.ts.
         Change the URL there, not here. -->
    <title>__SITE_TITLE__</title>
    <meta name="description" content="__SITE_DESCRIPTION__" />
    <link rel="canonical" href="__SITE_URL__/" />
    <meta name="author" content="Sonal Pandey" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta name="theme-color" content="__SITE_THEME_COLOR__" />
    <meta name="color-scheme" content="dark" />

    <!-- ── Icons ───────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/rocket.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ── Open Graph (Slack, WhatsApp, LinkedIn, iMessage…) ── -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="__SITE_NAME__" />
    <meta property="og:title" content="__SITE_TITLE__" />
    <meta property="og:description" content="__SITE_SOCIAL_DESCRIPTION__" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_OG_IMAGE__" />
    <!-- some older scrapers only look for the https variant -->
    <meta property="og:image:secure_url" content="__SITE_OG_IMAGE__" />
    <meta property="og:image:type" content="__SITE_OG_IMAGE_TYPE__" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="__SITE_OG_IMAGE_ALT__" />
    <meta property="og:locale" content="__SITE_LOCALE__" />
    <meta property="profile:first_name" content="Sonal" />
    <meta property="profile:last_name" content="Pandey" />
    <meta property="profile:username" content="Sonal-1601" />

    <!-- ── X / Twitter ─────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__SITE_TITLE__" />
    <meta name="twitter:description" content="__SITE_SOCIAL_DESCRIPTION__" />
    <meta name="twitter:image" content="__SITE_OG_IMAGE__" />
    <meta name="twitter:image:alt" content="__SITE_OG_IMAGE_ALT__" />

    <!-- ── Structured data — generated from the real project and
         skill data, so it can't drift from what's on the page ── -->
    <script type="application/ld+json">
      __SEO_JSONLD__
    </script>

    <!-- Hand-drawn + game + clean font pairing -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Kalam:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- Real content for crawlers and readers that don't run JS.
         React only ever touches #root, so this stays put and costs
         nothing visually to anyone with JS enabled. -->
    <noscript>

          <a href="https://medium.com/@pandeysonal1601/artist-on-click-1718603b7420">Read more</a>.

        </li>

      <h2>Elsewhere</h2>
      <ul>
        <li><a href="https://github.com/Sonal-1601">GitHub</a></li>
        <li><a href="https://www.linkedin.com/in/pandeysonal/">LinkedIn</a></li>
        <li><a href="https://medium.com/@pandeysonal1601">Medium</a></li>
      </ul>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
